<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f7f5ee"><title>Word Duel</title><link rel="stylesheet" href="style.css"><script type="module" src="game.js"></script></head>
<body><main class="shell"><header class="topline"><span class="brand"><span class="brand-mark">✳</span> WORD DUEL</span><span class="round-label" id="roundLabel"></span></header>
<section id="chooser" class="chooser" aria-labelledby="chooserTitle"><div class="eyebrow" id="chooserEyebrow">WORD PICK</div><h1 id="chooserTitle">Your move.</h1><p class="prompt" id="chooserPrompt"></p>
<form id="wordForm" autocomplete="off"><label class="field-label" for="secretWord">Secret word</label><input id="secretWord" name="word" type="text" required maxlength="24" spellcheck="false" placeholder="Type a word…"><label class="field-label hint-label" for="hint">Hint <span>optional</span></label><input id="hint" name="hint" type="text" maxlength="60" placeholder="A little clue">
<div class="tries-row"><label class="field-label" for="tries">Tries before losing</label><div class="stepper"><button type="button" id="minus" aria-label="Fewer tries">−</button><input id="tries" type="number" min="1" max="12" value="6"><button type="button" id="plus" aria-label="More tries">+</button></div></div>
<details class="settings"><summary><span>Game settings</span><span class="chevron">⌄</span></summary><div class="settings-content"><label class="field-label" for="mode">Game mode</label><select id="mode"><option value="classic">Classic</option><option value="sequence">Next letter</option><option value="clue-sequence">Next letter + clues</option><option value="wordle">Whole word</option></select><p id="modeDescription" class="mode-description"></p><div class="icon-settings"><label><span class="field-label">Tries left icon</span><input id="aliveIcon" maxlength="4" value="❤️" aria-label="Tries left icon"></label><label><span class="field-label">Lost try icon</span><input id="lostIcon" maxlength="4" value="💔" aria-label="Lost try icon"></label></div></div></details><button class="start-button" type="submit">Start round <span>↗</span></button></form></section>
<section id="game" class="game hidden" aria-live="polite"><div class="eyebrow" id="guessEyebrow">PLAYER 2 IS GUESSING</div><div id="hintDisplay" class="hint-display"></div><div id="hearts" class="hearts" aria-label="Tries remaining"></div><div id="feedback" class="feedback" aria-live="polite"></div><div id="wordDisplay" class="word-display"></div><div id="wordEntry" class="word-entry hidden"><div class="entry-caption">YOUR GUESS</div><div id="entryText" class="entry-text" aria-label="Current word guess"></div></div><div id="guesses" class="guesses"></div><div id="keyboard" class="keyboard" aria-label="Letter keyboard"></div><div class="game-note" id="gameNote">Choose a letter</div></section><div id="toast" class="toast" role="status"></div></main></body></html>
